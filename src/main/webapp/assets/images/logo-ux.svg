<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100" height="100">
  <defs>
    <!-- Metallic Gradient 1 -->
    <linearGradient id="metalGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#CBD5D8" />
      <stop offset="50%" stop-color="#7B8B90" />
      <stop offset="75%" stop-color="#E2E8EA" />
      <stop offset="100%" stop-color="#556468" />
    </linearGradient>
    <!-- Metallic Gradient 2 -->
    <linearGradient id="metalGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#9EACAF" />
      <stop offset="70%" stop-color="#67767A" />
      <stop offset="100%" stop-color="#C5D0D3" />
    </linearGradient>
    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Letter U: Left stem, bottom curve, right stem -->
    <path d="M 18,12 L 34,12 L 34,70 C 34,80 42,88 52,88 C 62,88 70,80 70,70 L 70,12 L 86,12 L 86,70 C 86,89 71,104 52,104 C 33,104 18,89 18,70 Z" 
          fill="url(#metalGrad1)" stroke="#4A565A" stroke-width="1" />
    
    <!-- Letter X: Intertwined diagonal lines -->
    <!-- X Stroke 1 (top-left to bottom-right) -->
    <path d="M 40,48 L 56,48 L 94,104 L 78,104 Z" 
          fill="url(#metalGrad2)" stroke="#3E494D" stroke-width="1" />
    
    <!-- X Stroke 2 (top-right to bottom-left) -->
    <path d="M 94,48 L 78,48 L 40,104 L 56,104 Z" 
          fill="url(#metalGrad1)" stroke="#3E494D" stroke-width="1" />
  </g>
</svg>
