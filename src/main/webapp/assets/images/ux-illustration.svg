<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%" height="auto">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Wavy line under browser -->
  <path d="M 90 280 Q 140 290 190 270 T 290 270" fill="none" stroke="#90AAB0" stroke-width="3" stroke-linecap="round" />

  <!-- Main Browser Window Container -->
  <g filter="url(#cardShadow)">
    <!-- Browser Header -->
    <rect x="60" y="50" width="310" height="32" rx="8" fill="#8FAFB6" />
    <!-- Header Window Dots -->
    <circle cx="78" cy="66" r="4" fill="#FFFFFF" opacity="0.9" />
    <circle cx="90" cy="66" r="4" fill="#FFFFFF" opacity="0.9" />
    <circle cx="102" cy="66" r="4" fill="#FFFFFF" opacity="0.9" />

    <!-- Browser Body -->
    <rect x="60" y="76" width="310" height="194" rx="0" fill="#FFFFFF" />
    <!-- Bottom rounded corners for browser -->
    <path d="M 60 250 L 60 262 Q 60 270 68 270 L 362 270 Q 370 270 370 262 L 370 250 Z" fill="#FFFFFF" />

    <!-- Browser Header Separator line -->
    <line x1="60" y1="76" x2="370" y2="76" stroke="#E2E8F0" stroke-width="1" />

    <!-- Inside Browser: Top horizontal placeholder bar -->
    <rect x="85" y="96" width="140" height="6" rx="3" fill="#E2E8F0" />

    <!-- Pie Chart (Left side) -->
    <g transform="translate(130, 168)">
      <!-- Slice 1 (Large slate teal) -->
      <path d="M 0 0 L -38 -20 A 42 42 0 1 1 20 37 Z" fill="#71939A" />
      <!-- Slice 2 (Light gray slice) -->
      <path d="M 0 0 L 20 37 A 42 42 0 0 1 -38 20 Z" fill="#CFDCDE" />
      <!-- Slice 3 (Top left slice) -->
      <path d="M 0 0 L -38 20 A 42 42 0 0 1 -38 -20 Z" fill="#A5C0C6" />
    </g>

    <!-- Bar Chart (Right side) -->
    <g transform="translate(245, 125)">
      <!-- Baseline -->
      <line x1="0" y1="80" x2="105" y2="80" stroke="#E2E8F0" stroke-width="2" />
      
      <!-- Bars -->
      <rect x="10" y="50" width="14" height="30" rx="2" fill="#A5C0C6" />
      <rect x="34" y="30" width="14" height="50" rx="2" fill="#CBD8DC" />
      <rect x="58" y="15" width="14" height="65" rx="2" fill="#71939A" />
      <rect x="82" y="40" width="14" height="40" rx="2" fill="#A5C0C6" />
    </g>
  </g>

  <!-- Overlapping User Profile Card Stack (Bottom Right) -->
  <g filter="url(#cardShadow)" transform="translate(265, 180)">
    <rect x="0" y="0" width="165" height="175" rx="10" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1" />
    
    <!-- User Row 1 -->
    <circle cx="30" cy="35" r="13" fill="#94A3B8" />
    <rect x="52" y="27" width="85" height="6" rx="3" fill="#E2E8F0" />
    <rect x="52" y="38" width="55" height="5" rx="2.5" fill="#F1F5F9" />

    <!-- User Row 2 -->
    <circle cx="30" cy="85" r="13" fill="#94A3B8" />
    <rect x="52" y="77" width="85" height="6" rx="3" fill="#E2E8F0" />
    <rect x="52" y="88" width="65" height="5" rx="2.5" fill="#F1F5F9" />

    <!-- User Row 3 -->
    <circle cx="30" cy="135" r="13" fill="#94A3B8" />
    <rect x="52" y="127" width="85" height="6" rx="3" fill="#E2E8F0" />
    <rect x="52" y="138" width="45" height="5" rx="2.5" fill="#F1F5F9" />
  </g>
</svg>
